<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f6a53b">
  <meta name="description" content="多聞小学校 ハロウィンイベント TAMON HAZARD 告知動画">
  <title>TAMON HAZARD | 10月24日</title>
  <style>
    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif
    }

    body {
      color: #633419;
      background: #f6a53b;
      background-image: radial-gradient(circle at 12% 12%, #ffcf74 0 2px, transparent 3px), radial-gradient(circle at 85% 28%, #fff0b2 0 3px, transparent 4px), radial-gradient(circle at 15% 80%, #fff0b2 0 2px, transparent 3px), linear-gradient(150deg, #ffbd58, #f6a13a 65%, #ef8e31);
      background-size: 130px 180px, 190px 210px, 160px 160px, auto
    }

    main {
      width: min(100%, 420px);
      min-height: 100vh;
      min-height: 100svh;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: calc(env(safe-area-inset-top) + 9px) 14px calc(env(safe-area-inset-bottom) + 10px);
      gap: 5px
    }

    .top {
      flex: none
    }

    .eyebrow {
      font-size: clamp(10px, 2.7vw, 12px);
      font-weight: 800;
      margin: 0 0 2px;
      letter-spacing: .04em
    }

    .title {
      font-size: clamp(19px, 5.6vw, 25px);
      line-height: 1.15;
      margin: 0;
      font-weight: 900;
      letter-spacing: .04em;
      color: #633419
    }

    .subtitle {
      font-size: clamp(10px, 2.8vw, 12px);
      font-weight: 700;
      margin: 3px 0 0
    }

    .frame {
      position: relative;
      min-height: 300px;
      min-width: 0;
      flex: 1 1 0;
      width: 100%
    }

    .video-shell {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      height: calc(100% - 8px);
      max-width: 100%;
      aspect-ratio: 9/16;
      border: 4px solid #fff5dc;
      border-radius: 14px;
      overflow: hidden;
      background: #211c20;
      box-shadow: 0 5px 0 #d97828, 0 8px 20px #9b531a44
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #18161a
    }

    .tap {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent
    }

    .tap .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #18161aaa;
      border: 3px solid #fff5dc;
      color: #fff5dc;
      font-size: 26px;
      line-height: 58px;
      padding-left: 5px;
      transition: opacity .25s
    }

    .tap.playing .icon {
      opacity: 0
    }

    .bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: #ffffff33;
      pointer-events: none
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #f6a53b
    }

    .bottom {
      flex: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px
    }

    .date {
      margin: 0;
      font-weight: 900;
      font-size: clamp(13px, 3.8vw, 17px);
      letter-spacing: .08em
    }

    .note {
      margin: 0;
      font-size: clamp(10px, 2.6vw, 12px);
      font-weight: 650;
      line-height: 1.35
    }

    .guide {
      margin: 0;
      font-size: 11px;
      min-height: 15px
    }

    .cta-slot {
      height: 47px;
      width: min(100%, 340px);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .cta {
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity .35s, transform .35s, visibility .35s;
      width: 100%
    }

    .cta.show {
      opacity: 1;
      visibility: visible;
      transform: none
    }

    .cta a {
      display: block;
      background: #fff9e8;
      border: 2px solid #fff;
      color: #713819;
      border-radius: 999px;
      text-decoration: none;
      padding: 10px 12px;
      font-weight: 900;
      font-size: 14px;
      box-shadow: 0 3px 0 #d7782a
    }

    .cta a:focus-visible {
      outline: 3px solid #4a291c;
      outline-offset: 3px
    }

    .lock {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: auto;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: #18161aee;
      color: #fff5dc;
      z-index: 2
    }

    .lock[hidden],
    .tap[hidden],
    .bar[hidden] {
      display: none
    }

    .lock p {
      margin: 0;
      font-weight: 800;
      font-size: 14px
    }

    .lock input {
      width: 100%;
      max-width: 260px;
      font-size: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #fff5dc;
      background: #fff9e8;
      color: #633419;
      text-align: center
    }

    .lock button {
      font-size: 15px;
      font-weight: 900;
      padding: 10px 22px;
      border: 0;
      border-radius: 999px;
      background: #f6a53b;
      color: #4a291c;
      box-shadow: 0 3px 0 #d7782a
    }

    .lock button:disabled {
      opacity: .6
    }

    .lock .msg {
      min-height: 18px;
      font-size: 12px;
      color: #ffcf74;
      text-align: center
    }

    .lock .eye {
      background: none;
      box-shadow: none;
      color: #ffcf74;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 6px;
      text-decoration: underline
    }

    @supports not (aspect-ratio:9/16) {
      .video-shell {
        width: min(100%, 240px)
      }
    }

    @media(max-height:580px) {
      main {
        gap: 2px;
        padding-top: calc(env(safe-area-inset-top) + 4px);
        padding-bottom: calc(env(safe-area-inset-bottom) + 4px)
      }

      .eyebrow {
        font-size: 10px
      }

      .title {
        font-size: 18px
      }

      .subtitle {
        font-size: 10px
      }

      .bottom {
        gap: 2px
      }

      .cta-slot {
        height: 41px
      }

      .cta a {
        padding: 7px 10px
      }

      .video-shell {
        border-width: 3px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .cta {
        transition: none
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="top">
      <p class="eyebrow">🎃 多聞小学校 ハロウィンイベント 🎉</p>
      <h1 class="title">TAMON HAZARD</h1>
      <p class="subtitle">ウイルスパニックからの脱出</p>
    </header>
    <div class="frame">
      <div class="video-shell"><video id="trailer" playsinline webkit-playsinline preload="metadata" poster="poster.jpg"
          aria-label="イベント告知動画"></video>
        <button type="button" class="tap" id="tap" aria-label="再生" hidden><span class="icon">▶</span></button>
        <div class="bar" hidden id="bar"><i id="barFill"></i></div>
      </div>
      <form class="lock" id="lock">
        <p>🔒 合言葉を入力してね</p><input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"
          spellcheck="false" aria-label="合言葉" enterkeyhint="go" required><button type="button" class="eye" id="eye">👁
          文字を表示</button><button id="unlockBtn" type="submit">見る</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>
    <div class="bottom">
      <p class="date">🎃 2026.10.24 SAT 🎃</p>
      <p class="note">イベントのための演出が含まれています。</p>
      <p class="guide" id="guide">🔒 合言葉を入力してね</p>
      <div class="cta-slot">
        <div class="cta" id="cta"><a id="apply" href="#" target="_blank" rel="noopener noreferrer">🎉 イベントに申し込む →</a>
        </div>
      </div>
    </div>
  </main>
  <script>
    const video = document.getElementById('trailer');
    const cta = document.getElementById('cta');
    const guide = document.getElementById('guide');
    const apply = document.getElementById('apply');
    const lock = document.getElementById('lock');
    const pw = document.getElementById('pw');
    const btn = document.getElementById('unlockBtn');
    const msg = document.getElementById('msg');

    /*UNLOCK_START*/
    async function unlockContent(password, onProgress) {
      const res = await fetch('trailer.enc');
      if (!res.ok) throw new Error('fetch');
      const total = +res.headers.get('content-length') || 0;
      let buf;
      if (res.body && res.body.getReader && total && !res.headers.get('content-encoding')) {
        buf = new Uint8Array(total);
        let got = 0; const rd = res.body.getReader();
        for (; ;) {
          const { done, value } = await rd.read();
          if (done) break;
          if (got + value.length > total) throw new Error('fetch');
          buf.set(value, got); got += value.length;
          if (onProgress) onProgress(got / total);
        }
        if (got !== total) throw new Error('fetch');
      } else {
        buf = new Uint8Array(await res.arrayBuffer());
      }
      if (onProgress) onProgress(1);
      const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.subarray(28);
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      let plain;
      try { plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data)); }
      catch (e) { throw new Error('password'); }
      const n = new DataView(plain.buffer).getUint32(0);
      const url = new TextDecoder().decode(plain.subarray(4, 4 + n));
      const blob = new Blob([plain.subarray(4 + n)], { type: 'video/mp4' });
      return { url, blob };
    }
    /*UNLOCK_END*/

    const eye = document.getElementById('eye');
    eye.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      eye.textContent = show ? '🙈 隠す' : '👁 文字を表示';
    });

    const HINT = 'うまくいかないときは、LINEの右上メニューなどから「Safariで開く」「ブラウザで開く」をためしてね';
    lock.addEventListener('submit', async e => {
      e.preventDefault();
      if (!window.crypto || !crypto.subtle) { msg.textContent = 'このブラウザでは開けません'; guide.textContent = HINT; return; }
      /* 全角文字・空白・見えない文字が混ざっていても、同じ合言葉として扱う */
      const password = pw.value.normalize('NFKC').replace(/[\s\u200B-\u200D\uFEFF]/g, '');
      btn.disabled = true; msg.textContent = 'ダウンロード中… 0%（約21MB）';
      try {
        const { url, blob } = await unlockContent(password, p => {
          msg.textContent = p >= 1 ? 'ロックを解除中…（数秒かかります）' : 'ダウンロード中… ' + Math.floor(p * 100) + '%（約21MB）';
        });
        apply.href = url;
        video.src = URL.createObjectURL(blob);
        lock.hidden = true; pw.value = '';
        tap.hidden = false; bar.hidden = false;
        guide.textContent = '▶ 動画をタップして再生してね！';
      } catch (err) {
        if (err.message === 'password') { msg.textContent = '合言葉が違います'; }
        else { msg.textContent = '読み込めませんでした'; guide.textContent = HINT; }
        btn.disabled = false;
      }
    });

    const tap = document.getElementById('tap');
    const bar = document.getElementById('bar');
    const barFill = document.getElementById('barFill');
    tap.addEventListener('click', () => {
      if (video.paused || video.ended) { const pr = video.play(); if (pr && pr.catch) pr.catch(() => { }); }
      else video.pause();
    });
    function syncTap() {
      const playing = !video.paused && !video.ended;
      tap.classList.toggle('playing', playing);
      tap.setAttribute('aria-label', playing ? '一時停止' : '再生');
      tap.querySelector('.icon').textContent = video.ended ? '↻' : '▶';
    }
    video.addEventListener('pause', syncTap);
    video.addEventListener('ended', syncTap);
    video.addEventListener('play', () => { guide.textContent = ''; syncTap(); });
    video.addEventListener('timeupdate', () => {
      if (video.duration) barFill.style.width = (video.currentTime / video.duration * 100) + '%';
    });
    video.addEventListener('timeupdate', () => {
      if (video.duration && video.duration - video.currentTime <= 3) cta.classList.add('show');
    });
    video.addEventListener('ended', () => { cta.classList.add('show'); guide.textContent = '最後まで見てくれてありがとう！ 🎃'; });
    video.addEventListener('error', () => { if (video.currentSrc) guide.textContent = '動画を読み込めませんでした。時間をおいて開き直してね'; });
  </script>
</body>

</html>
